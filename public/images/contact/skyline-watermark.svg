<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- subtle architectural skyline illustration in faint blue -->
  <g opacity="0.14" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left building -->
    <rect x="25" y="70" width="28" height="85" rx="1.5" fill="rgba(2,132,199,0.03)" />
    <line x1="32" y1="78" x2="32" y2="150" stroke-dasharray="2 3" />
    <line x1="39" y1="78" x2="39" y2="150" stroke-dasharray="2 3" />
    <line x1="46" y1="78" x2="46" y2="150" stroke-dasharray="2 3" />
    
    <!-- Center tall skyscraper with tiered crown and spire -->
    <!-- Spire -->
    <line x1="80" y1="8" x2="80" y2="28" stroke-width="1.5" />
    <circle cx="80" cy="8" r="1.5" fill="#0284c7" />
    <!-- Tier 1 -->
    <polygon points="76,28 84,28 83,42 77,42" fill="rgba(2,132,199,0.06)" />
    <!-- Tier 2 -->
    <rect x="71" y="42" width="18" height="18" rx="1" fill="rgba(2,132,199,0.05)" />
    <!-- Main tower body -->
    <rect x="63" y="60" width="34" height="95" rx="2" fill="rgba(2,132,199,0.04)" />
    <!-- Window grid / vertical mullions -->
    <line x1="70" y1="68" x2="70" y2="150" stroke-dasharray="3 3" />
    <line x1="77" y1="68" x2="77" y2="150" stroke-dasharray="3 3" />
    <line x1="83" y1="68" x2="83" y2="150" stroke-dasharray="3 3" />
    <line x1="90" y1="68" x2="90" y2="150" stroke-dasharray="3 3" />
    
    <!-- Right building -->
    <rect x="105" y="82" width="30" height="73" rx="1.5" fill="rgba(2,132,199,0.03)" />
    <line x1="112" y1="90" x2="112" y2="150" stroke-dasharray="2 3" />
    <line x1="120" y1="90" x2="120" y2="150" stroke-dasharray="2 3" />
    <line x1="128" y1="90" x2="128" y2="150" stroke-dasharray="2 3" />
  </g>
</svg>

